name: CloudTask CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Test, Build, and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: Check backend Python syntax
        run: python -m compileall -q app/backend

      - name: Build backend image
        run: docker build -t cloudtask-api:ci app/backend

      - name: Build frontend image
        run: docker build -t cloudtask-frontend:ci app/frontend

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Kustomize manifests
        run: kubectl kustomize manifests/base > /tmp/kustomize-rendered.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/cloudtask

      - name: Render Helm chart
        run: helm template cloudtask helm/cloudtask > /tmp/helm-rendered.yaml