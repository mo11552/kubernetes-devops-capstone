<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTask</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2.4rem;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #94a3b8;
    }

    form {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #1e293b;
      color: white;
      font-size: 1rem;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-button {
      background: #3b82f6;
      color: white;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .task-title {
      flex: 1;
    }

    .completed .task-title {
      color: #64748b;
      text-decoration: line-through;
    }

    .toggle-button {
      background: #22c55e;
      color: #052e16;
    }

    .delete-button {
      background: #ef4444;
      color: white;
    }

    .status {
      min-height: 24px;
      color: #93c5fd;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 30px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>CloudTask</h1>
    <p class="subtitle">A three-tier Kubernetes capstone application</p>

    <form id="task-form">
      <input
        id="task-input"
        type="text"
        maxlength="200"
        placeholder="Enter a new task"
        required
      >
      <button class="add-button" type="submit">Add Task</button>
    </form>

    <p id="status" class="status"></p>
    <section id="task-list"></section>
  </main>

  <script>
    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");
    const status = document.getElementById("status");

    async function loadTasks() {
      try {
        const response = await fetch("/api/tasks");
        const tasks = await response.json();
        renderTasks(tasks);
        status.textContent = `Connected to Kubernetes API • ${tasks.length} task(s)`;
      } catch (error) {
        status.textContent = "Unable to connect to the backend API.";
      }
    }

    function renderTasks(tasks) {
      list.replaceChildren();

      if (tasks.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No tasks yet. Add your first task above.";
        list.appendChild(empty);
        return;
      }

      tasks.forEach((task) => {
        const row = document.createElement("article");
        row.className = task.completed ? "task completed" : "task";

        const title = document.createElement("span");
        title.className = "task-title";
        title.textContent = task.title;

        const toggle = document.createElement("button");
        toggle.className = "toggle-button";
        toggle.textContent = task.completed ? "Undo" : "Done";
        toggle.addEventListener("click", () => updateTask(task));

        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.textContent = "Delete";
        remove.addEventListener("click", () => deleteTask(task.id));

        row.append(title, toggle, remove);
        list.appendChild(row);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      await fetch("/api/tasks", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({title: input.value})
      });

      input.value = "";
      await loadTasks();
    });

    async function updateTask(task) {
      await fetch(`/api/tasks/${task.id}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({completed: !task.completed})
      });

      await loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`/api/tasks/${id}`, {
        method: "DELETE"
      });

      await loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
