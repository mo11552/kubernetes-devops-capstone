apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudtask
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudtask-api
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtask-frontend
                port:
                  number: 80