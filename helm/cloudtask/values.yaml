namespace: cloudtask

api:
  replicaCount: 2
  image:
    repository: cloudtask-api
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 8080

frontend:
  replicaCount: 2
  image:
    repository: cloudtask-frontend
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 80

postgres:
  image:
    repository: postgres
    tag: 16-alpine
  database: cloudtask
  username: cloudtask
  password: cloudtask-dev-password
  persistence:
    size: 1Gi

ingress:
  className: nginx