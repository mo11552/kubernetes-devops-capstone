apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudtask-frontend
  namespace: cloudtask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudtask-frontend
  template:
    metadata:
      labels:
        app: cloudtask-frontend
    spec:
      containers:
        - name: frontend
          image: cloudtask-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: cloudtask-frontend
  namespace: cloudtask
spec:
  selector:
    app: cloudtask-frontend
  ports:
    - name: http
      port: 80
      targetPort: http